# One catalogue per namespace. ChaosEngines must live in the same namespace.
nameOverride: ""
fullnameOverride: ""

litmus-core:
  enabled: true
  nameOverride: litmus-core
  fullnameOverride: ""
  operatorMode: standard
  policies:
    monitoring:
      disabled: true
  operator:
    image:
      repository: docker.io/litmuschaos/chaos-operator
      tag: "3.30.0"
      pullPolicy: IfNotPresent
  runner:
    image:
      repository: docker.io/litmuschaos/chaos-runner
      tag: "3.30.0"
  exporter:
    enabled: false
    image:
      repository: docker.io/litmuschaos/chaos-exporter
      tag: "3.30.0"
      pullPolicy: IfNotPresent

# Optional ChaosCenter portal. It must be explicitly enabled and configured.
# The upstream chart is resolved at build time and included in packaged releases.
litmus-portal:
  enabled: false
  image:
    imageRegistryName: docker.io/litmuschaos
  # Never ship upstream's example admin password or MongoDB root password as
  # production credentials. Supply adminConfig, existingSecret, and MongoDB
  # credentials via deployment-specific values/secrets before enabling portal.
  mongodb:
    enabled: false

catalogue:
  enabled: true
  categories: []
  include: []
  exclude: []
  engineTemplates: true
  workflowTemplates: true

images:
  litmusRegistry: docker.io
  pullPolicy: IfNotPresent
  overrides: {}

execution:
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    imagePullSecrets: []
  rbac:
    create: true
    scope: Namespace

consumer:
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  rbac:
    create: true
