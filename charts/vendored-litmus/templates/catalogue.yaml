{{- if .Values.catalogue.enabled }}
{{- $faults := include "vl.faults" . | fromJsonArray }}
{{- $entries := list }}
{{- range $fault := $faults }}
{{- $entry := deepCopy $fault }}
{{- $_ := unset $entry "path" }}
{{- if $.Values.catalogue.engineTemplates }}
{{- $name := include "vl.documentName" (dict "root" $ "kind" "engine" "id" $fault.name) }}
{{- $_ := set $entry "engineConfigMap" $name }}
{{- $path := replace "fault.yaml" "engine.yaml" $fault.path }}
{{- $engine := fromYaml (include "vl.rewriteImages" (dict "root" $ "text" ($.Files.Get $path))) }}
{{- if not $engine.spec }}{{ fail (printf "Missing engine template: %s" $path) }}{{ end }}
{{- $_ := set $engine.metadata "name" (printf "%s-campaign" $fault.name) }}
{{- $_ := set $engine.metadata "namespace" $.Release.Namespace }}
{{- $_ := set $engine.spec "engineState" "stop" }}
{{- $_ := set $engine.spec "chaosServiceAccount" (include "vl.executionSA" $) }}
{{- if hasKey $engine.spec "appinfo" }}
{{- $_ := set $engine.spec.appinfo "appns" $.Release.Namespace }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vl.labels" $ | nindent 4 }}
    vendored-litmus.io/catalogue: engine
    vendored-litmus.io/fault: {{ $fault.name }}
    vendored-litmus.io/category: {{ $fault.category }}
data:
  engine.yaml: |
    {{- toYaml $engine | nindent 4 }}
{{- end }}
{{- $entries = append $entries $entry }}
{{- end }}
{{- $workflows := list }}
{{- if .Values.catalogue.workflowTemplates }}
{{- range $path, $_ := .Files.Glob "files/upstream/experiments/*/experiment*.yaml" }}
{{- $id := index (splitList "/" $path) 3 }}
{{- $variant := ternary "cron" "workflow" (hasSuffix "experiment_cron.yaml" $path) }}
{{- $name := include "vl.documentName" (dict "root" $ "kind" $variant "id" $id) }}
{{- $workflows = append $workflows (dict "name" $id "variant" $variant "configMap" $name "key" "manifest.yaml" "requires" "Argo Workflows; application-specific adaptation") }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vl.labels" $ | nindent 4 }}
    vendored-litmus.io/catalogue: workflow-reference
data:
  manifest.yaml: |
    {{- include "vl.rewriteImages" (dict "root" $ "text" ($.Files.Get $path)) | nindent 4 }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vl.fullname" . }}-index
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vl.labels" . | nindent 4 }}
    vendored-litmus.io/catalogue: index
data:
  catalogue.json: |
    {{- toPrettyJson (dict "schemaVersion" 1 "litmusVersion" .Chart.AppVersion "namespace" .Release.Namespace "executionServiceAccount" (include "vl.executionSA" .) "faults" $entries "workflowReferences" $workflows) | nindent 4 }}
{{- end }}
